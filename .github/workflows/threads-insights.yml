# 주간 Threads 성과 수집 — 발행완료 원고의 조회수/좋아요/답글/리포스트를
# Threads Insights API로 수집해 frontmatter에 기록하고, 주간 성과 리포트
# (07 운영/61 성과 기록/주간성과_YYYY-MM-DD.md)를 생성 + 텔레그램 요약 통지.
# 옛 맥 로컬 threads_insights.py를 클라우드로 이식한 것 (2026-08-26).
name: threads-insights

on:
  schedule:
    - cron: "30 22 * * 0"  # 매주 월요일 07:30 KST (일요일 22:30 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "빈 값=전체(수집+리포트), update=수집만, report=리포트만"
        required: false

concurrency:
  group: threads-insights
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests python-dotenv pyyaml anthropic

      # ANTHROPIC_API_KEY가 없으면 Claude Max 구독(CLAUDE_CODE_OAUTH_TOKEN)으로 실행
      - name: Install Claude Code CLI (Max 구독 인증용)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: 성과 수집 + 주간 리포트
        run: |
          if [ -n "${{ github.event.inputs.mode }}" ]; then
            python3 threads_insights.py --${{ github.event.inputs.mode }}
          else
            python3 threads_insights.py
          fi

      # 지표 갱신·리포트를 볼트에 커밋 (git이 유일한 동기화 경로, 경합 재시도 A8)
      - name: 볼트 커밋
        run: |
          python3 tools/vault_secret_scan.py vault/ --quiet
          git config user.name "orchestrator[bot]"
          git config user.email "actions@github.com"
          git add vault/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "주간 Threads 성과 수집 $(date +%Y-%m-%dT%H:%M)"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push 경합, 재시도 $i/5"; sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ]
