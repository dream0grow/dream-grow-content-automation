name: notify-top-reels

# 세션에서 고른 릴스 TOP 3를 텔레그램으로 1회 전송한다.
# 메시지 파일(또는 이 워크플로우)이 바뀐 push에서만 실행되므로 중복 발송되지 않는다.
on:
  push:
    branches:
      - claude/top-reels-content-selection-zh68y9
    paths:
      - .github/notify/top_reels_telegram.txt
      - .github/workflows/notify-top-reels.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          from vault_pipeline import telegram_notify
          text = open(".github/notify/top_reels_telegram.txt", encoding="utf-8").read()
          ok = telegram_notify.send(text, html=True)
          print("텔레그램 전송:", "성공" if ok else "실패 (시크릿 누락 또는 API 오류)")
          raise SystemExit(0 if ok else 1)
          EOF
