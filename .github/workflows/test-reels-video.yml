# 릴스(숏폼) 영상 실제 생성 (수동 실행)
# 릴스 원고(05 리뷰/대기) 파일명 또는 주제를 입력하면:
# 장면별 9:16 클립을 Muapi.ai(Open Generative AI 게이트웨이)로 생성 → ffmpeg 합본 → MP4 아티팩트 업로드.
name: test-reels-video

on:
  workflow_dispatch:
    inputs:
      script:
        description: "릴스 원고 파일명 (05 리뷰/대기, 부분 일치 가능. 예: 원고_릴스_훈육_좋은+훈육)"
        required: false
      topic:
        description: "원고 없이 주제만으로 생성 (script를 비웠을 때)"
        required: false
      max_scenes:
        description: "최대 장면 수 (기본 7)"
        required: false
        default: "7"
      dry_run:
        description: "true면 프롬프트만 뽑고 영상 생성 안 함 (키 불필요)"
        required: false
        default: "false"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MUAPI_API_KEY: ${{ secrets.MUAPI_API_KEY }}
      DG_REELS_VIDEO_MODEL: ${{ secrets.DG_REELS_VIDEO_MODEL }}
      DG_REELS_VIDEO_RESOLUTION: ${{ secrets.DG_REELS_VIDEO_RESOLUTION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests python-dotenv pyyaml

      - name: Install Claude Code CLI (Max 구독 인증용)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate reels video
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ -n "${{ github.event.inputs.script }}" ]; then
            python3 -m orchestrator.reels_video --script "${{ github.event.inputs.script }}" \
              --max-scenes "${{ github.event.inputs.max_scenes || '7' }}" --out reels_out $ARGS
          else
            python3 -m orchestrator.reels_video --topic "${{ github.event.inputs.topic }}" \
              --max-scenes "${{ github.event.inputs.max_scenes || '7' }}" --out reels_out $ARGS
          fi

      - name: Upload reels artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reels-video
          path: |
            reels_out/*.mp4
            reels_out/reels_plan.json
            reels_out/notes.md
