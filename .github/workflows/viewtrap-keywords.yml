# 뷰트랩 키워드 발굴 (하루 30개)
# viewtrap_keyword_queue.json의 pending 키워드를 뷰트랩에서 검색·채점해
# 벤치마킹 시트 "잠재고객키워드수요(풀링)" 탭에 기록하고, 5점 이상 키워드의 상위 조회수 영상을
# "풀링 영상 만들기" 탭에 추가한다. 큐 파일은 커밋으로 되돌려 다음 날 이어간다.
# 필요 시크릿: VIEWTRAP_COOKIE (뷰트랩 로그인 쿠키), GSHEET_SA_JSON (시트 서비스 계정)
# 선택: TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (요약 알림), ANTHROPIC_API_KEY (교육·육아 채널 선별)
# 설정 방법: docs/viewtrap-keywords-setup.md
name: viewtrap-keywords

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC = 09:00 KST
  workflow_dispatch:
    inputs:
      limit:
        description: "오늘 처리할 키워드 수 (기본 30)"
        required: false
        default: "30"
      dry_run:
        description: "true면 검색·기록 없이 계획만 출력"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: viewtrap-keywords
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90   # 검색 1건 50~70초 + 대기 8~15초 × 30건
    env:
      VIEWTRAP_COOKIE: ${{ secrets.VIEWTRAP_COOKIE }}
      GSHEET_SA_JSON: ${{ secrets.GSHEET_SA_JSON }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests python-dotenv google-auth pyyaml

      - name: Install Claude Code CLI (Max 구독 인증용, API 키 없을 때만)
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Run keyword pipeline
        run: |
          ARGS="--limit ${{ github.event.inputs.limit || '30' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python3 -m orchestrator.viewtrap_keywords $ARGS

      - name: Commit queue state
        if: ${{ always() }}
        run: |
          git config user.name "viewtrap-keywords[bot]"
          git config user.email "actions@github.com"
          git add viewtrap_keyword_queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "뷰트랩 키워드 큐 갱신 $(date +%Y-%m-%d)"
          pushed=0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${{ github.ref_name }} || true
            if git push origin HEAD:${{ github.ref_name }}; then pushed=1; break; fi
            echo "push 경합, 재시도 $i/5"; sleep $((RANDOM % 4 + 2))
          done
          [ "$pushed" = 1 ]
